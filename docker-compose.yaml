services:
  backend:
    build: .
    container_name: node-server
    ports:
      - "3000:3000"
    volumes:
      - .:/app 
    command: npm run dev 
    env_file:
      - ./src/config/.env
  
  db: 
    image: mysql:8.0.45 
    environment:       
      MYSQL_DATABASE: manage
      MYSQL_ROOT_PASSWORD: root
    volumes: 
      - ./storage/dbdata:/var/lib/mysql
    ports: 
      - 3360:3306
  
  mongo:
    image: mongo:7
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - ./storage/mongo:/data/db 

  redis:
    image: redis:8-alpine
    container_name: redis 
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./storage/redis_data:/data